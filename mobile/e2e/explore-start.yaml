# Fresh JS, the first-run developer menu dismissed, signed in as the staging student.
appId: net.outclass.app
---
- runFlow: dev-connect.yaml
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible:
        id: "sign-in-submit"
    commands:
      - tapOn:
          id: "sign-in-email"
      - inputText: ${STUDENT_EMAIL}
      - tapOn:
          id: "sign-in-password"
      - inputText: ${STUDENT_PASSWORD}
      - tapOn:
          id: "sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
