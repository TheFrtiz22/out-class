# Signs out the current account through Settings, then signs in as the staging alumni account. Pass -e SHOTS=<prefix>.
appId: net.outclass.app
---
- runFlow:
    when:
      visible:
        id: "tab-profile"
    file: settings-sign-out.yaml
- tapOn:
    id: "sign-in-email"
- inputText: ${ALUMNI_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${ALUMNI_PASSWORD}
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 90000
- takeScreenshot: ${SHOTS}-00-home
