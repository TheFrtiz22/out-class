# Account deletion: cancel the pending request.
appId: net.outclass.app
---
- scrollUntilVisible:
    element:
      id: "account-deletion-cancel"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "account-deletion-cancel"
- extendedWaitUntil:
    notVisible:
      id: "account-deletion-cancel"
    timeout: 90000
- takeScreenshot: ${SHOTS}-52-delete-cancelled
