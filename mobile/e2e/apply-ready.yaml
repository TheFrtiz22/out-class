# Shared start for the applications flows: load the app from Metro (-e METRO_PORT=<port>, default 8081),
# dismiss its introduction, sign in as the staging student if needed, and wait for Home.
appId: net.outclass.app
env:
  METRO_PORT: "8081"
---
# Always (re)load the bundle from Metro: the dev client otherwise reopens whatever it ran last.
- openLink: "outclass://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "sign-in-submit|home-screen|application-screen|applications-screen|interview-screen|decision-screen"
    timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible:
        id: "sign-in-submit"
    commands:
      - tapOn:
          id: "sign-in-email"
      - inputText: ${STUDENT_EMAIL}
      - tapOn:
          id: "sign-in-password"
      - inputText: ${STUDENT_PASSWORD}
      - tapOn:
          id: "sign-in-submit"
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 30000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
