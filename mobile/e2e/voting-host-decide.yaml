# Host, with a ballot open: close the vote (confirming an early close if ballots are missing), confirm the
# leading choice, and land on the next applicant with voting not yet open.
appId: net.outclass.app
---
- scrollUntilVisible:
    element:
      id: "voting-close"
    direction: DOWN
- tapOn:
    id: "voting-close"
- runFlow:
    when:
      visible:
        id: "confirm-accept"
    commands:
      - tapOn:
          id: "confirm-accept"
- scrollUntilVisible:
    element:
      id: "voting-decide-accept"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "voting-decide-accept"
- scrollUntilVisible:
    element:
      id: "voting-open"
    direction: DOWN
    timeout: 30000
