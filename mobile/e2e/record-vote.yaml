# Release build, screen being recorded: a voting member opens the live room and casts a ballot.
appId: net.outclass.app
---
- openLink: "outclass://voting/e89ed370-6e82-4b3d-a454-091e0b109207?clubId=253d3ff8-35eb-4619-81bf-c7c195bbf4fe"
- runFlow:
    when:
      visible:
        id: "voting-join-button"
    commands:
      - tapOn:
          id: "voting-join-button"
- extendedWaitUntil:
    visible:
      id: "voting-ballot"
    timeout: 60000
- tapOn:
    id: "voting-choice-accept"
- extendedWaitUntil:
    visible: "Vote recorded.*"
    timeout: 30000
