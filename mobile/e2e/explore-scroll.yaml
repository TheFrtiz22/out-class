# Explore scroll check: fling through the whole directory and back (run after explore-list).
appId: net.outclass.app
---
- assertVisible:
    id: "explore-screen"
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 15%
          duration: 120
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 90%
          duration: 120
- assertVisible:
    id: "explore-search"
