# Signs the simulator in as the staging leader. If another account is signed in, signs it out first
# (Settings -> Account & Security -> Sign out), then signs in.
appId: net.outclass.app
---
- runFlow: leader-dev-connect.yaml
- runFlow:
    when:
      visible:
        id: "home-screen"
      notVisible:
        id: "home-leader-tools"
    commands:
      - openLink: "outclass://settings/account"
      - extendedWaitUntil:
          visible:
            id: "settings-sign-out"
          timeout: 20000
      - tapOn:
          id: "settings-sign-out"
      - tapOn:
          id: "confirm-accept"
      - extendedWaitUntil:
          visible:
            id: "sign-in-submit"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "sign-in-submit"
    commands:
      - tapOn:
          id: "sign-in-email"
      - inputText: ${LEADER_EMAIL}
      - tapOn:
          id: "sign-in-password"
      - inputText: ${LEADER_PASSWORD}
      - tapOn:
          id: "sign-in-submit"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "home-leader-tools"
    direction: DOWN
