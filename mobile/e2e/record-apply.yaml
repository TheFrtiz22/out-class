# Release build, screen being recorded: fill and submit a fresh draft (-e APPLICATION_ID=<id from scripts/staging/start-application.cjs>).
appId: net.outclass.app
---
- openLink: "outclass://application/${APPLICATION_ID}"
- extendedWaitUntil:
    visible:
      id: "draft-progress"
    timeout: 90000

# Submitting with required questions unanswered is refused before anything is sent.
- scrollUntilVisible:
    element:
      id: "draft-review"
    direction: DOWN
- tapOn:
    id: "draft-review"
- scrollUntilVisible:
    element:
      id: "draft-error"
    direction: UP
- assertVisible: "A few responses need your attention. Your draft can still be saved."

- scrollUntilVisible:
    element:
      id: "answer-1"
    direction: DOWN
- tapOn:
    id: "answer-1"
- inputText: "I want a place to write every week and to hear honest notes from other writers."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "answer-2"
    direction: DOWN
- tapOn:
    id: "answer-2"
- inputText: "Our class zine lost its editor a week before print. I took over the layout and we shipped on time."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "answer-3"
    direction: DOWN
- tapOn:
    id: "answer-3"
- tapOn: "3 to 5 hours"
- scrollUntilVisible:
    element: "Events and community"
    direction: DOWN
- tapOn: "Events and community"
- scrollUntilVisible:
    element:
      id: "draft-review"
    direction: DOWN
- tapOn:
    id: "draft-review"
- assertVisible: "Ready to send your application?"
- tapOn:
    id: "confirm-accept"
- extendedWaitUntil:
    visible: "Your application was submitted successfully."
    timeout: 90000
- assertVisible:
    id: "application-status"
