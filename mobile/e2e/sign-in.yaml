appId: net.outclass.app
---
- runFlow:
    when:
      visible:
        id: "sign-in-submit"
    commands:
      - tapOn:
          id: "sign-in-email"
      - inputText: ${STUDENT_EMAIL}
      - tapOn:
          id: "sign-in-password"
      - inputText: ${STUDENT_PASSWORD}
      - tapOn:
          id: "sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- takeScreenshot: ../../.shots/home
