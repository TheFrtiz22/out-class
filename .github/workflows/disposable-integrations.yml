name: Disposable integration verification

# No repository secrets, hosted Auth, production database or external SMTP
# credentials. Each job provisions its own local fixture on a fresh runner.
on:
  # Runs on every PR (no paths filter): its jobs are required status checks on
  # main, and GitHub never reports a filtered-out required check, which blocks
  # docs- and config-only PRs forever.
  pull_request:
  # The merge queue tests each PR on top of everything queued ahead of it.
  merge_group:
  # The heavy optional journeys skip PR pushes (see FULL_JOURNEYS below) and run here.
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: disposable-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-postgres:
    name: Native PostgreSQL / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # security and transactions are required checks and always run; events, audiences and
        # scheduler (not required) run in the merge queue, on main, nightly, or with full-ci.
        suite: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["security","events","audiences","transactions","scheduler"]' || '["security","transactions"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scheduler baseline compares against a reviewed historical commit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build compiled site CSS for event-browser fixture
        if: matrix.suite == 'events'
        run: pnpm build
      - name: Install browser for event discovery fixture
        if: matrix.suite == 'events'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run native tests on dedicated disposable PostgreSQL
        env:
          # No secrets or hosted connection strings are supplied to this job.
          OUTCLASS_POLL_ONLY: "0"
        run: |
          case "${{ matrix.suite }}" in
            security) node scripts/run-disposable-postgres.cjs security ;;
            events) node scripts/run-disposable-postgres.cjs events ;;
            audiences) node scripts/test-decision-publication-local.cjs ;;
            transactions) node scripts/test-decision-transactions-local.cjs ;;
            scheduler) node scripts/test-scheduler-polling-local.cjs ;;
            *) echo "Unknown suite" >&2; exit 2 ;;
          esac

  authenticated-next-supabase:
    name: Local Auth, settings and navigation
    # Not a required check. Full sign-in journeys run in the merge queue, on main and nightly;
    # on a PR only with the full-ci label, to keep the shared runner queue moving.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Next.js / Supabase Auth / SMTP / settings, selected-navigation and active Interview Rooms integration
        env:
          OUTCLASS_HYDRATION_CAPTURE_DIR: ${{ runner.temp }}/hydration-captures
          OUTCLASS_E2E_LOG_DIR: ${{ runner.temp }}/supabase-start-logs
        run: node scripts/run-onboarding-e2e.cjs --club-integration --selected-navigation --pipeline-release-repair --active-interviews
      # Redacted `supabase start` output from any failed attempt (the runner retries once).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-start-logs-settings
          path: ${{ runner.temp }}/supabase-start-logs
          if-no-files-found: ignore
          retention-days: 7
      # Attacker pass summary (case, result, notes) from tests/attacker-pass-e2e.test.cjs. Labels, statuses
      # and counts only: no response bodies, credentials or fixture personal data.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attacker-pass
          path: test-results/attacker-pass.json
          if-no-files-found: warn
          retention-days: 14
      # Server HTML and the hydrated DOM from any React hydration error (#418/#423/#425), disposable fixture data only.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydration-captures
          path: ${{ runner.temp }}/hydration-captures
          if-no-files-found: ignore
          retention-days: 7

  applicant-workflow-regressions:
    name: Applicant workflow / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # shell: persistent workspace shell, header height/spacing, dashboard split and overview views.
        # application-writing is a required check and always runs; dashboards and shell
        # (not required) run in the merge queue, on main, nightly, or with the full-ci label.
        suite: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["dashboards","application-writing","shell"]' || '["application-writing"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify existing real Auth and production-build applicant journeys
        env:
          OUTCLASS_E2E_LOG_DIR: ${{ runner.temp }}/supabase-start-logs
        run: node scripts/run-onboarding-e2e.cjs --${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-start-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/supabase-start-logs
          if-no-files-found: ignore
          retention-days: 7

  local-storage:
    name: Private Storage and native PostgreSQL
    # Not a required check: merge queue, main, nightly, or full-ci.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local Supabase Storage fixture
        run: node scripts/run-availability-e2e.cjs --event-storage

  coverage-report:
    name: Integration infrastructure coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-disposable-integration-coverage.cjs
