name: Disposable integration verification

# No repository secrets, hosted Auth, production database or external SMTP
# credentials. Each job provisions its own local fixture on a fresh runner.
on:
  # Runs on every PR (no paths filter): some of its jobs are required status checks
  # on main, and GitHub never reports a filtered-out required check, which blocks
  # docs- and config-only PRs forever. The `changes` job below decides which of the
  # NON-required suites a PR needs; required ones always run.
  pull_request:
  workflow_dispatch:
  # Nightly full run on main (was weekly), so a break that only lighter PRs touched shows up next morning.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: disposable-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required checks (ruleset protect-main): Native PostgreSQL / security and / transactions,
  # Applicant workflow / application-writing and Integration infrastructure coverage. They run on
  # every PR. The other suites run on a PR only when it touches the code they exercise (list below)
  # or carries the `full-ci` label (applied on the next push), and always nightly on main and on
  # manual dispatch. Each PR push used to start 11 jobs here; UI- and docs-only PRs now start 5.
  changes:
    name: Choose integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.pick.outputs.full }}
      native: ${{ steps.pick.outputs.native }}
      applicant: ${{ steps.pick.outputs.applicant }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          full=true
          if [ "$EVENT" = "pull_request" ] && [ "$FULL_LABEL" != "true" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
            # Auth, data, server, shell layout and the test fixtures themselves.
            risky='^(prisma/|supabase/|actions/|app/api/|app/auth/|utils/|lib/(auth|rate-limit|supabase|demo|platform)|middleware\.ts$|next\.config\.mjs$|package\.json$|pnpm-lock\.yaml$|components/shell/|styles/|app/layout\.tsx$|app/\(workspace\)/layout\.tsx$|scripts/(run-|test-|check-disposable|navigation-audit)|tests/helpers/|tests/[^/]*(e2e|native)[^/]*$|\.github/workflows/disposable-integrations\.yml$)'
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Eq "$risky"; then full=false; fi
          fi
          if [ "$full" = true ]; then
            native='["security","events","audiences","transactions","scheduler"]'; applicant='["dashboards","application-writing","shell"]'
          else
            native='["security","transactions"]'; applicant='["application-writing"]'
          fi
          { echo "full=$full"; echo "native=$native"; echo "applicant=$applicant"; } >> "$GITHUB_OUTPUT"
          echo "Full integration suites: $full" >> "$GITHUB_STEP_SUMMARY"

  native-postgres:
    name: Native PostgreSQL / ${{ matrix.suite }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.native) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scheduler baseline compares against a reviewed historical commit.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build compiled site CSS for event-browser fixture
        if: matrix.suite == 'events'
        run: pnpm build
      - name: Install browser for event discovery fixture
        if: matrix.suite == 'events'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run native tests on dedicated disposable PostgreSQL
        env:
          # No secrets or hosted connection strings are supplied to this job.
          OUTCLASS_POLL_ONLY: "0"
        run: |
          case "${{ matrix.suite }}" in
            security) node scripts/run-disposable-postgres.cjs security ;;
            events) node scripts/run-disposable-postgres.cjs events ;;
            audiences) node scripts/test-decision-publication-local.cjs ;;
            transactions) node scripts/test-decision-transactions-local.cjs ;;
            scheduler) node scripts/test-scheduler-polling-local.cjs ;;
            *) echo "Unknown suite" >&2; exit 2 ;;
          esac

  authenticated-next-supabase:
    name: Local Auth, settings and navigation
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Next.js / Supabase Auth / SMTP / settings, selected-navigation and active Interview Rooms integration
        env:
          OUTCLASS_HYDRATION_CAPTURE_DIR: ${{ runner.temp }}/hydration-captures
          OUTCLASS_E2E_LOG_DIR: ${{ runner.temp }}/supabase-start-logs
        run: node scripts/run-onboarding-e2e.cjs --club-integration --selected-navigation --pipeline-release-repair --active-interviews
      # Redacted `supabase start` output from any failed attempt (the runner retries once).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-start-logs-settings
          path: ${{ runner.temp }}/supabase-start-logs
          if-no-files-found: ignore
          retention-days: 7
      # Attacker pass summary (case, result, notes) from tests/attacker-pass-e2e.test.cjs. Labels, statuses
      # and counts only: no response bodies, credentials or fixture personal data.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attacker-pass
          path: test-results/attacker-pass.json
          if-no-files-found: warn
          retention-days: 14
      # Server HTML and the hydrated DOM from any React hydration error (#418/#423/#425), disposable fixture data only.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydration-captures
          path: ${{ runner.temp }}/hydration-captures
          if-no-files-found: ignore
          retention-days: 7

  applicant-workflow-regressions:
    name: Applicant workflow / ${{ matrix.suite }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # dashboards, application-writing, shell (persistent workspace shell, header height/spacing,
        # dashboard split and overview views); see the changes job.
        suite: ${{ fromJSON(needs.changes.outputs.applicant) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify existing real Auth and production-build applicant journeys
        env:
          OUTCLASS_E2E_LOG_DIR: ${{ runner.temp }}/supabase-start-logs
        run: node scripts/run-onboarding-e2e.cjs --${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-start-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/supabase-start-logs
          if-no-files-found: ignore
          retention-days: 7

  local-storage:
    name: Private Storage and native PostgreSQL
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local Supabase Storage fixture
        run: node scripts/run-availability-e2e.cjs --event-storage

  coverage-report:
    name: Integration infrastructure coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-disposable-integration-coverage.cjs
