name: Pipeline release gated functional supplement

# Opt in once; separate fresh VMs from every timing collector, no repository secrets.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-release-gated-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-release-functional-supplement'
    name: Remaining gated workflows / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [corkboard, admin, active, communications]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise existing real HTTP, Auth, PostgreSQL and Storage assertions
        run: pnpm exec node scripts/run-pipeline-release-gated-qa.cjs ${{ matrix.suite }}
